name: Testar exemplos da régua

on:
  pull_request:
  push:
    branches: [main]

jobs:
  exemplos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Conferir exemplos e tabela do README
        run: python -I .claude/skills/dimensionamento-ntec/scripts/testar_exemplos.py
